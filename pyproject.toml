[project]
name = "auto-doodle-insta"
version = "1.0.0"
description = "Instagram DM Ultra-Fast Vector Sketch & Full-Spectrum Painting Bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "keyboard>=0.13.5",
    "mouse>=0.7.1",
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "ttkbootstrap>=1.10.1",
]

[tool.uv]
package = false

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "."]

